# ekf_localization and grid_mapping. The EKF starts at the sim's initial pose
# (known start, as when a robot leaves its dock).
ekf_localization:
  ros__parameters:
    initial_x: 1.5
    initial_y: 1.5
    initial_theta: 0.0
    initial_sigma_xy: 0.05
    initial_sigma_theta: 0.02
    # Noise densities: cover the sim's white noise plus its systematic errors.
    sigma_v: 0.03
    sigma_w: 0.03
    use_imu: true
    imu_yaw_sigma: 0.02
    use_icp: true
    icp_method: point_to_line
    icp_max_correspondence_dist: 0.3
    icp_max_iterations: 30
    icp_min_correspondences: 40
    icp_max_rmse: 0.05
    icp_min_inlier_ratio: 0.5
    icp_sigma_xy: 0.03
    icp_sigma_theta: 0.01
    scan_stride: 2

grid_mapping:
  ros__parameters:
    resolution: 0.05
    origin_x: -1.0
    origin_y: -1.0
    width_m: 14.0
    height_m: 11.0
    max_pose_age: 0.1
    publish_period: 1.0
